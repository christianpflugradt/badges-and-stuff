name: Pages
on:
  repository_dispatch:
    types: [statistics]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Store statistics payload
        if: github.event_name == 'repository_dispatch'
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          set -euo pipefail
          printf '%s' "$PAYLOAD" >"$RUNNER_TEMP/payload.json"
          project="$(python3 scripts/ingest.py "$RUNNER_TEMP/payload.json")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No change for $project."
          else
            git commit --message "chore(statistics): update $project"
            git push
          fi

      - name: Render site
        run: python3 scripts/render.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
