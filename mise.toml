[tools]
"github:please-behave/cli" = "0.15.0"
python = "3.15.2"
actionlint = "1.7.12"
yq = "4.54.3"
gitleaks = "8.30.1"
shellcheck = "0.11.0"
ruff = "0.17.4"

[tasks.format]
description = "Format Python sources"
run = "git ls-files -z '*.py' | xargs -0 ruff format"

[tasks.verify]
description = "Run the deterministic Please Behave checks and stop at the first blocker"
run = "please run --at pre-push --checks-only --fail-fast"

[tasks.setup]
description = "Prepare dependencies before Git hooks (none: the scripts use only the Python standard library)"
run = "echo 'Nothing to prepare.'"
